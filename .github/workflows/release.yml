# Builds a signed APK and AAB and publishes them as a GitHub Release.
# Triggered by pushing a tag such as v0.1.0 (the tag becomes the versionName).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK and AAB
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease bundleRelease \
            -PversionName="${GITHUB_REF_NAME#v}" -PversionCode="${{ github.run_number }}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ControleFinanceiro-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/ControleFinanceiro-$GITHUB_REF_NAME.aab"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Controle Financeiro $GITHUB_REF_NAME" --generate-notes
